---
# This workflow is designed to help GitHub action
# support with CI on NCO implementation Standard
# Optimized for Code Manager and Repository
# Administrator Governance
#
# Lin Gan, 10/29/2026

name: docs

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: rrfs-workflow
          submodules: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinxcontrib-bibtex sphinx-rtd-theme

      - name: Inject CI Documentation
        run: |
          cat << 'EOF' > rrfs-workflow/docs/source/ci_guidance.rst
          ====================================================================
          RRFS CI Design & Code Manager Usage Guide
          These CI pipelines enforce only a subset of the NCO Implementation
          Standards, as not all standards can be fully automated through a CI
          process.
          ====================================================================

          System Architecture Design
          --------------------------------------------------------------------
          .. image:: ci_design_diagram.png

          :width: 800

          :alt: CI Architecture and Sandbox Flowchart

          :align: center

          Core Design Pattern
          --------------------------------------------------------------------
          Every CI test adheres to a strict standard to maintain uniformity:

          * **Workflow File (.yml):** Named
          ``NCO_Consistency_${CI_Test_Job_Name}.yml``.

          * **Exclusion List (.lst):** Named
          ``exclude_file_list_${CI_Test_Job_Name}.lst``. Admin-controlled
          global bypass list.

          * **Regression Test (.sh):** Named
          ``regression_test_${CI_Test_Job_Name}.sh``. A local sandbox to
          verify linter logic.

          * **Zero-Match Logic:** If a branch lacks target files, the CI
          completes successfully (exit 0) and logs "No files found to check".

          * **Artifact Generation:** Outputs are logged to ``ci_run.log`` and
          uploaded as artifacts.

          Detailed CI Testing Specifications
          --------------------------------------------------------------------
          1. Bash Consistency (NCO_Consistency_Bash)
          ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          Multi-stage bash verification using ``shellcheck`` and custom
          expressions. Enforces POSIX standards, requires the ``#!/bin/bash``
          shebang, mandates ``set -x`` for operational traceability, and
          prohibits unconditional ``exit 0`` at the EOF to prevent masked
          failures.

          Automatically scans files ending in ``.sh``/``.bash`` or residing in
          ``jobs/`` and ``scripts/``. Bypass locally via ``# ci-ignore:
          bash_setx`` or globally via PR tags (e.g., ``bash_shellcheck``).

          Code managers use ``exclude_file_list_Bash.lst``
          for permanent repository exclusions.

          2. Implementation Standard (NCO_Consistency_Implementation_Standard)
          ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          Enforces NCO EE2 checklist directory layouts. CI discovers all shell
          scripts, builds a dynamic manifest, and feeds it to
          ``linter_nco_implementation_standard.py``. It blocks subdirectories
          in ``./jobs`` and ``./scripts``, prevents hardcoded paths
          (``/lfs``), and validates ``err_chk`` usage post-MPI execution.

          Code managers use ``exclude_file_list_Implementation_Standard.lst``
          for permanent repository exclusions.

          Execute ``./regression_test_python_Implementation_Standard.sh`` with
          ``MOCK="YES"`` to test custom NCO Implementation Standard linter
          logic against dummy files.

          3. Python Consistency (NCO_Consistency_Python)
          ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          Executes ``flake8`` for PEP-8 syntax validation and ``pytest`` for
          unit test coverage (with ``pytest-cov``). It dynamically excludes
          common virtual environments (``venv``, ``build``) to prevent
          pipeline bloating.

          Target configurations and workflows written in Python. Emergency
          bypasses are available via ``python_flake8`` or ``python_pytest`` PR
          flags.

          Code managers use ``exclude_file_list_python.lst``
          for permanent repository exclusions.

          4. Yamllint Standard (NCO_Consistency_Yamllint)
          ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          Utilizes the standard ``yamllint`` utility to ensure foundational
          syntax correctness, enforcing a maximum line length of 120
          characters and blocking trailing spaces.

          Code managers use ``exclude_file_list_Yamllint.lst``
          for permanent repository exclusions.

          Fails on broken syntax. Excludes GitHub workflows by default to
          prevent conflicts. Inline skip via ``# ci-ignore: yamllint``.

          5. Yamllint Scientific
          (NCO_Consistency_Yamllint_Scientific_Hierarchical)
          ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          Deploys a custom PyYAML ``UniqueKeyLoader`` parser. It prevents
          catastrophic parameter overwrites in JEDI/MPAS models by throwing
          hard errors if duplicate keys are detected within a configuration
          block (which standard parsers overwrite silently).

          Includes GitHub workflows to ensure maximum repository integrity.
          Bypass specific scientific parameters via ``# ci-ignore:
          yamllint_scientific``.

          Code managers use ``exclude_file_list_Yamllint_Scientific_Hierarchical.lst``
          for permanent repository exclusions.

          Skipping & Disabling Checks
          --------------------------------------------------------------------
          1. **Global Skip (PR Message):** Add ``ci-ignore: <job_name>`` to
          commit/PR bodies.

          2. **File-level Skip (Inline):** Place ``# ci-ignore: <job_name>``
          directly in the target file.

          3. **Repository-level Skip:** Add paths to the respective
          ``exclude_file_list_*.lst`` files.

          EOF

          if [ -f rrfs-workflow/docs/source/index.rst ]; then
            if ! grep -q "ci_guidance"                 rrfs-workflow/docs/source/index.rst; then
              sed -i '/.. toctree::/a \   ci_guidance'                 rrfs-workflow/docs/source/index.rst
            fi
          fi

      - name: Build docs
        run: |
          cd rrfs-workflow/docs
          sphinx-build source build

      - uses: actions/upload-artifact@v4
        with:
          name: rrfs-workflow docs
          path: rrfs-workflow/docs/build