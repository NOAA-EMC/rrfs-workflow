     - obs space:
         name: refl10cm
         distribution:
           name: "RoundRobin"
           halo size: 500e3
         obsdatain:
           engine:
             type: H5File
             obsfile: data/obs/ioda_mrms_refl.nc
             missing file action: "warn"
         obsdataout:
           engine:
             type: H5File
             allow overwrite: true
             obsfile: jdiag_mrms_refl.nc
         io pool:
           write multiple files: false
         _source: mrms
         simulated variables:
         - equivalentReflectivityFactor
       obs operator:
         name: VertInterp
         vertical coordinate: height_above_mean_sea_level
         observation vertical coordinate: height
         interpolation method: linear
         observation alias file: obsop_name_map.yaml
       obs localizations:
         - localization method: Horizontal Gaspari-Cohn
           lengthscale: 15e3
       _obsname: refl10cm
       obs filters:
       # Reset the QCflags at the beginning of a new outer loop
       - filter: AcceptList
         apply at iterations: 1
         identifier:
           name: NewLoopReset

       # Remove all obs outside the regional domain polygon
       - filter: Polygon Check
         identifier:
           name: PolygonCheck
           logging: true
         <<: *polygonConfig

       - filter: Background Check
         apply at iterations: 0,1
         identifier:
           name: GrossErrorCheck
           logging: true
           diagnostic flag new: false
         filter variables:
         - name: equivalentReflectivityFactor
         threshold: 12.0
         action:
           name: reject
