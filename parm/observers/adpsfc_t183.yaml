     - obs space:
         name: adpsfc_t183
         distribution:
           name: "RoundRobin"
           halo size: 500e3
         obsdatain:
           engine:
             type: H5File
             obsfile: "data/obs/ioda_adpsfc.nc"
             missing file action: "warn"
           obsgrouping:
             group variables: ["stationIdentification"]
             sort variable: "pressure"
             sort order: "descending"
         obsdataout:
           empty obs space action: "@emptyObsSpaceAction@"
           engine:
             type: H5File
             obsfile: jdiag_adpsfc_t183.nc
             allow overwrite: true
         io pool:
           max pool size: 1
         observed variables: [airTemperatureAt2M]
         simulated variables: [airTemperatureAt2M]

       obs operator:
         name: Identity

       linear obs operator:
         name: Identity
         variable maps:
         - name: airTemperatureAt2M
           alias: air_temperature

       obs error:
         covariance model: diagonal

       obs localizations:
         - localization method: Horizontal Gaspari-Cohn
           lengthscale: 200e3 # orig

       obs filters:
         # ------------------
         # airTemperatureAt2M (183)
         # ------------------
         # Reset the QCflags at the beginning of a new outer loop
         - filter: AcceptList
           apply at iterations: 1
           identifier:
             name: NewLoopReset

         # Remove all obs outside the regional domain polygon
         - filter: Polygon Check
           identifier:
             name: PolygonCheck
             logging: true
           <<: *polygonConfig

         # Time window filter
         - filter: Domain Check
           identifier:
             name: TimeWindowCheck
             logging: true
           where:
             - variable:
                 name: MetaData/timeOffset # units: s
               minvalue: -900
               maxvalue:  900
           action:
             name: reduce obs space

         # Remove all invalid obs from this observer
         - filter: Perform Action
           identifier:
             name: ObsInvalidCheck
             logging: true
           where:
           - variable: ObsValue/airTemperatureAt2M
             value: is_not_valid
           action:
             name: reduce obs space

         # Remove obs of other obsTypes
         - filter: Perform Action
           identifier:
             name: ObsTypeCheck
             logging: true
           where:
           - variable: ObsType/airTemperatureAt2M
             is_not_in: 183
           action:
             name: reduce obs space

         # Remove all obs with QualityMarker > 3
         - filter: RejectList
           identifier:
             name: QcMarkerCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           where:
           - variable: QualityMarker/airTemperatureAt2M
             is_in: 4-15
             value: is_not_valid
           where operator: or
           action:
             name: reduce obs space

         # Duplicate Check
         - filter: DuplicateThinning
           identifier:
             name: DuplicateThinning
             logging: true
           filter variables:
           - name: airTemperatureAt2M
           analysis_time: "@ANALYSIS_DATE@"
           analysis_time_tolerance: PT0M
           min_spacing: PT90M
           equidistant_time_selection: after
           variable names:
           - MetaData/stationIdentification
           tolerance:
           - 1.0e+6
           action:
             name: reduce obs space

         - filter: Variable Assignment
           apply at iterations: 0,1
           identifier:
             name: DerivedSurfaceTemperature
             logging: true
           assignments:
           - name: DerivedObsValue/airTemperatureAt2M
             type: float
             function:
               name: ObsFunction/ModelHeightAdjustedAirTemperature
               options:
                 elevation:
                   name: MetaData/stationElevation
                 temperature lapse rate in K/km:
                   scheme: local
                   level1: 1
                   level2: 10
                   bounds:
                     minvalue: 0.5
                     maxvalue: 10.0

         # Online regional domain check
         - filter: Bounds Check
           apply at iterations: 0,1
           identifier:
             name: RegionalDomainCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           test variables:
           - name:  GeoVaLs/observable_domain_mask
           minvalue: 0.0
           maxvalue: 0.5

         # Initial error assignment
         - filter: Perform Action
           apply at iterations: 0,1
           identifier:
             name: ObsErrorInit
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           where:
           - variable: ObsType/airTemperatureAt2M
             is_in: 183
           action:
             name: assign error
             error function:
               name: ObsFunction/ObsErrorModelStepwiseLinear
               options:
                 xvar:
                   name: MetaData/pressure
                 xvals: [110000, 105000, 100000, 95000, 90000, 85000, 80000, 75000, 70000, 65000, 60000, 55000, 50000, 45000, 40000, 35000, 30000, 25000, 20000, 15000, 10000, 7500, 5000, 4000, 3000, 2000, 1000, 500, 400, 300, 200, 100, 0]
                 errors: [2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349, 2.6349]

#         # Error inflation based on pressure check (setupt.f90)
#         - filter: Perform Action
#           apply at iterations: 0,1
#           identifier:
#             name: ObsErrorFactorPressureCheck
#             logging: true
#             diagnostic flag new: false
#           filter variables:
#           - name: airTemperatureAt2M
#           where:
#           - variable: ObsType/airTemperatureAt2M
#             is_in: 183
#           action:
#             name: inflate error
#             inflation variable:
#               name: ObsFunction/ObsErrorFactorPressureCheck
#               options:
#                 variable: airTemperatureAt2M
#                 inflation factor: 8.0

#         # Error inflation based on errormod (qcmod.f90)
#         - filter: Perform Action
#           identifier:
#             name: ObsErrorFactorConventional
#             logging: true
#             diagnostic flag new: false
#           filter variables:
#           - name: airTemperatureAt2M
#           where:
#           - variable: ObsType/airTemperatureAt2M
#             is_in: 183
#           action:
#             name: inflate error
#             inflation variable:
#               name: ObsFunction/ObsErrorFactorConventional
#               options:
#                 inflate variables: [airTemperatureAt2M]
#                 pressure: MetaData/pressure

         # Error inflation when QualityMarker == 3 (read_prepbufr.f90)
         - filter: Perform Action
           apply at iterations: 0,1
           identifier:
             name: ObsErrorFactorQm3_
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           action:
             name: inflate error
             inflation factor: 1.2
           where:
           - variable: QualityMarker/airTemperatureAt2M
             is_in: 3

         # Error inflation when observation pressure < 100 hPa (read_prepbufr.f90)
         - filter: Perform Action
           apply at iterations: 0,1
           identifier:
             name: ObsErrorFactorHighAltitude
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           action:
             name: inflate error
             inflation factor: 1.2
           where:
           - variable: MetaData/pressure
             maxvalue: 10000.0

         # Bounds Check (ObsError)
         - filter: Bounds Check
           apply at iterations: 0,1
           identifier:
             name: ObsErrorBoundsCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           test variables:
           - name:  ObsErrorData/airTemperatureAt2M
           minvalue: 0.0
           maxvalue: 1000
           action:
             name: reject

         # Bounds Check (ObsValue)
         - filter: Bounds Check
           apply at iterations: 0,1
           identifier:
             name: ObsValueBoundsCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           minvalue: 100
           maxvalue: 400
           action:
             name: reject

         # Create temporary ObsErrorData
         - filter: Variable Assignment
           apply at iterations: 0,1
           identifier:
             name: TempObsErrorData
             logging: true
             diagnostic flag new: false
           assignments:
           - name: TempObsErrorData/airTemperatureAt2M
             type: float
             function:
               name: ObsFunction/Arithmetic
               options:
                 variables:
                 - name: ObsErrorData/airTemperatureAt2M
           defer to post: true

         # Set ObsError set "error parameter" if < "max value"
         - filter: Perform Action
           apply at iterations: 0,1
           identifier:
             name: ObsErrorMinForGEC
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           action:
             name: assign error
             error parameter: 1.0
           where:
           - variable:
               name: ObsErrorData/airTemperatureAt2M
             maxvalue: 1.0
           - variable:
               name: ObsErrorData/airTemperatureAt2M
             value: is_valid
           defer to post: true

         # Set ObsError set "error parameter" if > "min value"
         - filter: Perform Action
           apply at iterations: 0,1
           identifier:
             name: ObsErrorMaxForGEC
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           action:
             name: assign error
             error parameter: 3.0
           where:
           - variable:
               name: ObsErrorData/airTemperatureAt2M
             minvalue: 3.0
           - variable:
               name: ObsErrorData/airTemperatureAt2M
             value: is_valid
           defer to post: true

         # Gross Error Check
         - filter: Background Check
           apply at iterations: 0,1
           identifier:
             name: GrossErrorCheck
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           threshold: 5.0
           action:
             name: reject
           where:
           - variable: ObsType/airTemperatureAt2M
           - variable: QualityMarker/airTemperatureAt2M
             is_not_in: 3
           defer to post: true

         # Gross Error Check: cgross*0.7 if QualityMarker=3
         - filter: Background Check
           apply at iterations: 0,1
           identifier:
             name: GrossErrorCheckQm3_
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           threshold: 3.5
           action:
             name: reject
           where:
           - variable: ObsType/airTemperatureAt2M
           - variable: QualityMarker/airTemperatureAt2M
             is_in: 3
           defer to post: true

         # Re-assign err ObsErrorData <--- TempObsErrorData after gross error check.
         - filter: Perform Action
           apply at iterations: 0,1
           identifier:
             name: ObsErrorCopyBack
             logging: true
             diagnostic flag new: false
           filter variables:
           - name: airTemperatureAt2M
           action:
             name: assign error
             error function: TempObsErrorData/airTemperatureAt2M
           where:
           - variable:
               name: TempObsErrorData/airTemperatureAt2M
             value: is_valid
           defer to post: true

         #- filter: GOMsaver
